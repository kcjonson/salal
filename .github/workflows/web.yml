name: Web

# Compiles foundation and renderer for wasm32-emscripten and links nothing
# runnable. It exists to catch native-only code creeping into the two libraries
# a browser build depends on. Its own workflow so a failure is a separate red
# check on the PR; it is deliberately not a required check, so it can fail
# without blocking a merge, but it never passes when the build is broken.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: '617ef1c0c422737d117eda00a471ea1be5bad088'
  EMSDK_VERSION: '4.0.10'

jobs:
  emscripten:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install emsdk
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{ env.EMSDK_VERSION }}
        actions-cache-folder: emsdk-cache

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Point vcpkg at a binary cache directory
      run: |
        mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
        echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-binary-cache,readwrite" >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: vcpkg-wasm32-emscripten-${{ env.EMSDK_VERSION }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-overlay-ports/**') }}
        restore-keys: vcpkg-wasm32-emscripten-${{ env.EMSDK_VERSION }}-

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

    # vcpkg's wasm32-emscripten triplet finds the SDK through EMSDK, and CMake
    # chainloads Emscripten's own toolchain file behind vcpkg's.
    - name: Configure
      run: |
        emroot="$(dirname "$(command -v emcc)")"
        export EMSDK="${EMSDK:-$(cd "$emroot/../.." && pwd)}"
        echo "EMSDK=$EMSDK"
        cmake -S . -B build-wasm -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$emroot/cmake/Modules/Platform/Emscripten.cmake" \
          -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
          -DBUILD_TESTING=OFF

    - name: Save vcpkg binary cache
      if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: vcpkg-wasm32-emscripten-${{ env.EMSDK_VERSION }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-overlay-ports/**') }}

    - name: Build foundation and renderer
      run: cmake --build build-wasm --target foundation renderer
